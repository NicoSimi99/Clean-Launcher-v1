name: Build Clean Launcher

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: unzip CleanLauncher-NSStudios.zip

      - name: Build release bundle
        working-directory: app-source/CleanLauncher
        run: gradle bundleRelease

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: CleanLauncher-AAB
          path: app-source/CleanLauncher/app/build/outputs/bundle/release/*.aab
          
